<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Kotoba Mirror</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header class="brand"><span class="mark" aria-hidden="true">文</span><div><strong>Kotoba Mirror</strong><small>Belajar dua bahasa, satu halaman.</small></div></header>
  <div class="pair-preview"><span><b>日本語</b><small>Terjemahan</small></span><span class="link-icon" aria-hidden="true">⇄</span><span><b>English</b><small>Halaman asli</small></span></div>
  <div class="language-grid"><label>Bahasa asli<select id="source"></select></label><label>Bahasa belajar<select id="target"></select></label></div>
  <label class="check"><input type="checkbox" id="scroll" checked> Sinkronkan scroll dua arah</label>
  <label class="check"><input type="checkbox" id="click" checked> Teruskan klik ke halaman asli</label>
  <label class="check"><input type="checkbox" id="furigana" checked> Furigana untuk bahasa Jepang</label>
  <button class="primary" id="start">Buka kiri–kanan</button>
  <p id="status" role="status">Penerjemah lokal Chrome. Tanpa API key.<br>Paket bahasa diunduh saat pertama dipakai.</p>
  <p class="fine">Dua jendela akan ditata otomatis. Saat mirror ditutup, ukuran jendela asli dipulihkan.</p>
  <script src="languages.js"></script><script src="popup.js"></script>
</body></html>
